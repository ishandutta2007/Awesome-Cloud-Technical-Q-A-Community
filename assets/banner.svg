<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient 1 -->
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(3deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .floating-node-1 { animation: floatSlow 8s ease-in-out infinite; }
      .floating-node-2 { animation: floatSlow 6s ease-in-out infinite reverse; }
      .glowing-orb { animation: pulseGlow 5s ease-in-out infinite; }
      .tech-grid { opacity: 0.15; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Animated Background Orbs (Behind text foreground) -->
  <circle class="glowing-orb" cx="150" cy="100" r="180" fill="#38bdf8" filter="blur(60px)" />
  <circle class="glowing-orb" cx="1050" cy="300" r="200" fill="#a855f7" filter="blur(70px)" />

  <!-- Grid Overlay -->
  <g class="tech-grid" stroke="#ffffff" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" />
  </g>

  <!-- Decorative Animated Graphic Elements (Positioned away from text center) -->
  <!-- Left Side Floating Q&A Card Element -->
  <g class="floating-node-1" transform="translate(60, 120)">
    <rect width="180" height="90" rx="12" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="30" cy="30" r="12" fill="#38bdf8" />
    <text x="30" y="34" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">?</text>
    <rect x="52" y="24" width="95" height="8" rx="4" fill="#ffffff" opacity="0.8" />
    <rect x="52" y="38" width="70" height="6" rx="3" fill="#94a3b8" />
    <rect x="25" y="60" width="130" height="14" rx="7" fill="#38bdf8" opacity="0.3" />
  </g>

  <!-- Right Side Floating Cloud Node Element -->
  <g class="floating-node-2" transform="translate(960, 180)">
    <rect width="180" height="90" rx="12" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="30" cy="30" r="12" fill="#4ade80" />
    <text x="30" y="34" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <rect x="52" y="24" width="95" height="8" rx="4" fill="#ffffff" opacity="0.8" />
    <rect x="52" y="38" width="80" height="6" rx="3" fill="#94a3b8" />
    <rect x="25" y="60" width="130" height="14" rx="7" fill="#4ade80" opacity="0.3" />
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed 100% visible & readable) -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Top Pill Badge -->
    <rect x="-140" y="65" width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="87" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      ☁️ CLOUD TECHNICAL Q&amp;A
    </text>

    <!-- Main Title -->
    <text x="0" y="175" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Cloud Technical Q&amp;A
    </text>
    
    <!-- Gradient Subtitle Line -->
    <text x="0" y="225" fill="url(#accent1)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">
      Community Ecosystem &amp; Developer Forums
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Curated Commercial SaaS Platforms &amp; Open-Source Self-Hosted Forum Software
    </text>

    <!-- Category Pills Foreground -->
    <g transform="translate(0, 315)">
      <rect x="-240" y="0" width="140" height="28" rx="14" fill="#334155" />
      <text x="-170" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">💬 Forums</text>

      <rect x="-80" y="0" width="160" height="28" rx="14" fill="#334155" />
      <text x="0" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">❓ Developer Q&amp;A</text>

      <rect x="100" y="0" width="140" height="28" rx="14" fill="#334155" />
      <text x="170" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🔓 Open Source</text>
    </g>
  </g>
</svg>
